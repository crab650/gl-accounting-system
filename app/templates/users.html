{% extends 'base.html' %}{% block body %}<h2>使用者</h2><section class="card"><h3>新增使用者</h3><form method="post" class="grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>帳號<input name="username" required></label><label>密碼（至少 12 字元）<input name="password" type="password" minlength="12" required></label><label>角色<select name="role">{% for role in roles %}<option>{{ role }}</option>{% endfor %}</select></label><button>新增</button></form></section><section class="card"><table><tr><th>帳號</th><th>角色</th><th>狀態</th></tr>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ user.role }}</td><td>{{ '啟用' if user.is_active else '停用' }}</td></tr>{% endfor %}</table></section>{% endblock %}
