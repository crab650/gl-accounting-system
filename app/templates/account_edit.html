{% extends 'base.html' %}{% block body %}<h2>編輯科目 {{ account.code }}</h2><section class="card"><form method="post" class="grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>代碼<input name="code" value="{{ account.code }}" required></label><label>名稱<input name="name" value="{{ account.name }}" required></label><label>類型<select name="type">{% for type in types %}<option value="{{ type }}" {% if account.type == type %}selected{% endif %}>{{ account_types[type].label }}（{{ type }}）</option>{% endfor %}</select></label><label>父科目<select name="parent_id"><option value="">無</option>{% for a in accounts if a.id != account.id %}<option value="{{ a.id }}" {% if account.parent_id == a.id %}selected{% endif %}>{{ a.code }} {{ a.name }}</option>{% endfor %}</select></label><label>報表分類<input name="report_group" value="{{ account.report_group or '' }}"></label><label><input type="checkbox" name="postable" {% if account.postable %}checked{% endif %}> 可過帳</label><label><input type="checkbox" name="active" {% if account.active %}checked{% endif %}> 啟用</label><button>儲存</button></form></section><p><a href="{{ url_for('gl.accounts') }}">查看科目類型說明</a></p>{% endblock %}
