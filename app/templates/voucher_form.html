{% extends 'base.html' %}{% block body %}<h2>{{ '編輯傳票' if voucher else '新增傳票' }}</h2><section class="card"><form method="post" id="voucher-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><label>傳票編號<input name="voucher_no" value="{{ voucher.voucher_no if voucher else '' }}" required></label><label>日期<input name="voucher_date" type="date" value="{{ voucher.voucher_date if voucher else '' }}" required></label><label>會計期間<select name="period_id" required>{% for p in periods %}<option value="{{ p.id }}" {% if voucher and voucher.period_id == p.id %}selected{% endif %}>{{ p.fiscal_year }}-{{ p.period_no }} {{ p.start_date }}～{{ p.end_date }}</option>{% endfor %}</select></label><label>摘要<input name="description" value="{{ voucher.description if voucher else '' }}" required></label></div><h3>分錄</h3><table id="lines"><thead><tr><th>科目</th><th>摘要</th><th>借方</th><th>貸方</th></tr></thead><tbody>{% for line in voucher.lines if voucher %}<tr><td><select name="account_id"><option value="">選擇科目</option>{% for a in accounts %}<option value="{{ a.id }}" {% if line.account_id == a.id %}selected{% endif %}>{{ a.code }} {{ a.name }}</option>{% endfor %}</select></td><td><input name="line_description" value="{{ line.description }}"></td><td><input name="debit" type="number" min="0" step="0.01" value="{{ '%.2f' % (line.debit_minor / 100) if line.debit_minor else '' }}"></td><td><input name="credit" type="number" min="0" step="0.01" value="{{ '%.2f' % (line.credit_minor / 100) if line.credit_minor else '' }}"></td></tr>{% else %}{% for i in range(2) %}<tr><td><select name="account_id"><option value="">選擇科目</option>{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}</select></td><td><input name="line_description"></td><td><input name="debit" type="number" min="0" step="0.01"></td><td><input name="credit" type="number" min="0" step="0.01"></td></tr>{% endfor %}{% endfor %}</tbody></table><p><button type="button" class="subtle" id="add-line">新增分錄列</button> <span id="difference"></span></p><button>儲存草稿</button></form></section><script src="{{ url_for('static', filename='voucher.js') }}"></script>{% endblock %}
