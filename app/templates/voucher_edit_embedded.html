<section class="card"><form method="post" id="voucher-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><label>編號<input name="voucher_no" value="{{ voucher.voucher_no }}" required></label><label>日期<input name="voucher_date" type="date" value="{{ voucher.voucher_date }}" required></label><label>期間<select name="period_id">{% for p in periods %}<option value="{{ p.id }}" {% if p.id == voucher.period_id %}selected{% endif %}>{{ p.fiscal_year }}-{{ p.period_no }}</option>{% endfor %}</select></label><label>摘要<input name="description" value="{{ voucher.description }}" required></label></div><table id="lines"><tr><th>科目</th><th>摘要</th><th>借方</th><th>貸方</th></tr><tbody>{% for line in voucher.lines %}<tr><td><select name="account_id">{% for a in accounts %}<option value="{{ a.id }}" {% if a.id == line.account_id %}selected{% endif %}>{{ a.code }} {{ a.name }}</option>{% endfor %}</select></td><td><input name="line_description" value="{{ line.description }}"></td><td><input name="debit" type="number" min="0" step="0.01" value="{{ '%.2f' % (line.debit_minor / 100) if line.debit_minor else '' }}"></td><td><input name="credit" type="number" min="0" step="0.01" value="{{ '%.2f' % (line.credit_minor / 100) if line.credit_minor else '' }}"></td></tr>{% endfor %}</tbody></table><p><button type="button" class="subtle" id="add-line">新增分錄列</button> <span id="difference"></span></p><button>儲存修改</button></form></section><script src="{{ url_for('static', filename='voucher.js') }}"></script>
