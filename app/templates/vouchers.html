{% extends 'base.html' %}{% block body %}<h2>傳票</h2>{% if current_user.role in ('ADMIN','ACCOUNTANT') %}<p><a class="button" href="{{ url_for('gl.new_voucher') }}">新增傳票</a></p>{% endif %}<form method="get" class="filters"><label>狀態<select name="status"><option value="">全部</option>{% for s in ('DRAFT','SUBMITTED','APPROVED','REJECTED','POSTED') %}<option {% if status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><button>查詢</button></form><section class="card"><table><tr><th>日期</th><th>編號</th><th>摘要</th><th>狀態</th></tr>{% for v in vouchers %}<tr><td>{{ v.voucher_date }}</td><td><a href="{{ url_for('gl.voucher_detail', voucher_id=v.id) }}">{{ v.voucher_no }}</a></td><td>{{ v.description }}</td><td><span class="badge">{{ v.status }}</span></td></tr>{% else %}<tr><td colspan="4">尚無傳票</td></tr>{% endfor %}</table></section>{% endblock %}
